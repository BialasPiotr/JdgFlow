spring:
  application:
    name: jdgflow
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    baseline-on-migrate: false
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always
  tomcat:
    max-http-form-post-size: 1MB
    max-swallow-size: 2MB
  max-http-request-header-size: 16KB

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

jdgflow:
  jwt:
    # No default — application refuses to start without an explicit secret.
    # Dev profile supplies a value in application-dev.yml; prod must export JDGFLOW_JWT_SECRET.
    secret: ${JDGFLOW_JWT_SECRET}
    ttl: ${JDGFLOW_JWT_TTL:PT24H}
    issuer: jdgflow
  integration:
    fakturownia:
      base-url: ${FAKTUROWNIA_BASE_URL:https://example.fakturownia.pl}
      api-token: ${FAKTUROWNIA_API_TOKEN:replace-with-real-token}
      default-page-size: 50
    claude:
      base-url: ${CLAUDE_API_BASE_URL:https://api.anthropic.com}
      api-key: ${ANTHROPIC_API_KEY:not-configured}
      model: ${CLAUDE_MODEL:claude-sonnet-4-6}
      timeout: PT60S
    sendgrid:
      base-url: ${SENDGRID_BASE_URL:https://api.sendgrid.com}
      api-key: ${SENDGRID_API_KEY:not-configured}
      from-email: ${SENDGRID_FROM_EMAIL:noreply@example.com}
      from-name: ${SENDGRID_FROM_NAME:JDGFlow}
      timeout: PT30S
      reminder-days-before: ${SENDGRID_REMINDER_DAYS_BEFORE:3}
  storage:
    minio:
      endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
      access-key: ${MINIO_ROOT_USER:minioadmin}
      secret-key: ${MINIO_ROOT_PASSWORD:minioadmin}
      bucket: ${MINIO_BUCKET:jdgflow-receipts}

logging:
  level:
    root: INFO
    pl.cafteo.jdgflow: DEBUG
