<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="JDGFlow — panel zarządzania jednoosobową działalnością gospodarczą" />
    <title>JDGFlow</title>
    <script>
      // Resolve theme before React mounts to avoid light-flash on dark-default load.
      (function () {
        try {
          var stored = localStorage.getItem("jdgflow-theme");
          var theme = stored === "light" ? "light" : "dark";
          document.documentElement.classList.toggle("dark", theme === "dark");
          document.documentElement.style.colorScheme = theme;
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
